<style>
  :root{
    --bg:#101114;
    --bg-elev:#17191d;
    --bg-elev-2:#1f2126;
    --border:#2a2d33;
    --text:#eceef0;
    --text-dim:#9a9ea6;
    --text-faint:#6b6f77;
    --accent:#e8621a;
    --accent-dim:#3a2a1c;
    --radius:14px;
    --eq-bodyweight:#4a90d9;
    --eq-dumbbell:#e8621a;
    --eq-barbell:#c0392b;
    --eq-machine:#8e5fc9;
    --eq-cable:#16a085;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  a{color:inherit}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}

  /* Top bar */
  header.top{
    position:sticky;top:0;z-index:20;
    background:rgba(16,17,20,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    padding:12px 0;
  }
  .topbar-inner{display:flex;align-items:center;gap:10px}
  .brand{
    display:flex;align-items:center;gap:8px;
    font-weight:800;font-size:15px;letter-spacing:0.2px;
    white-space:nowrap;cursor:pointer;user-select:none;
  }
  .brand .mark{
    width:26px;height:26px;border-radius:7px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;
    font-weight:900;color:#fff;font-size:16px;flex:none;
  }
  .search-box{
    flex:1;position:relative;
  }
  .search-box input{
    width:100%;
    background:var(--bg-elev-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:9px 12px 9px 34px;
    font-size:14px;
    outline:none;
  }
  .search-box input:focus{border-color:var(--accent)}
  .search-box::before{
    content:"⌕";
    position:absolute;left:11px;top:50%;transform:translateY(-52%);
    color:var(--text-faint);font-size:16px;
  }
  .back-btn{
    background:var(--bg-elev-2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;
    cursor:pointer;white-space:nowrap;flex:none;
  }
  .back-btn:hover{border-color:var(--accent)}
  .lang-toggle{
    background:var(--bg-elev-2);border:1px solid var(--border);
    border-radius:10px;padding:9px 10px;font-size:12.5px;font-weight:700;
    cursor:pointer;white-space:nowrap;flex:none;
    display:flex;align-items:center;gap:4px;color:var(--text-faint);
  }
  .lang-toggle:hover{border-color:var(--accent)}
  .lang-toggle .lang-opt{padding:2px 3px;border-radius:5px;color:var(--text-faint)}
  .lang-toggle .lang-opt.active{color:#fff;background:var(--accent-dim)}
  .lang-toggle .lang-sep{color:var(--border)}

  /* chips */
  .chip-row{
    display:flex;gap:8px;overflow-x:auto;padding:12px 0 0;
    -ms-overflow-style:none;scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none}
  .chip{
    flex:none;
    background:var(--bg-elev-2);border:1px solid var(--border);
    color:var(--text-dim);
    padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;
    cursor:pointer;white-space:nowrap;
    display:flex;align-items:center;gap:6px;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .chip.active{
    background:var(--accent-dim);border-color:var(--accent);color:#fff;
  }

  /* hero */
  .hero{padding:34px 0 8px}
  .hero h1{font-size:clamp(24px,4vw,34px);margin:0 0 6px;letter-spacing:-0.5px}
  .hero p{color:var(--text-dim);margin:0;font-size:14.5px;line-height:1.5;max-width:560px}

  /* group grid */
  .group-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px;margin-top:22px;
  }
  .group-card{
    background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 12px 14px;text-align:center;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    transition:transform .12s ease, border-color .12s ease;
  }
  .group-card:hover{border-color:var(--group-color,var(--accent));transform:translateY(-2px)}
  .group-card svg{width:56px;height:auto}
  .group-card .gname{font-weight:700;font-size:14px}
  .group-card .gcount{font-size:12px;color:var(--text-faint)}

  /* group detail header */
  .group-header{
    display:flex;align-items:center;gap:16px;padding:22px 0 6px;
  }
  .group-header svg{width:64px;height:auto;flex:none}
  .group-header h2{margin:0 0 3px;font-size:24px}
  .group-header .sub{color:var(--text-dim);font-size:13.5px;margin:0}

  /* section label for search-all mode */
  .section-label{
    font-size:12px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-faint);
    margin:26px 0 10px;font-weight:700;
  }

  /* exercise grid */
  .ex-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:14px;margin-top:16px;
  }
  .ex-card{
    background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;display:flex;flex-direction:row;gap:12px;
  }
  .pictogram{
    flex:none;width:84px;height:104px;
    background:var(--bg-elev-2);border:1px solid var(--border);border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .pictogram svg{width:100%;height:100%;display:block}
  .pictogram.has-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .ex-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
  .ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .ex-name{font-weight:700;font-size:15.5px;line-height:1.3}
  .eq-badge{
    flex:none;font-size:10.5px;font-weight:800;letter-spacing:0.4px;text-transform:uppercase;
    padding:4px 8px;border-radius:6px;color:#fff;white-space:nowrap;
  }
  .muscle-row{display:flex;flex-wrap:wrap;gap:6px}
  .pill{
    font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;
  }
  .pill.primary{background:var(--accent-dim);color:#ffb37a;border:1px solid #5a3a22}
  .pill.secondary{background:var(--bg-elev-2);color:var(--text-dim);border:1px solid var(--border)}
  .cue{font-size:13px;line-height:1.5;color:var(--text-dim)}
  .cue b{color:var(--text)}
  .video-link{
    align-self:flex-start;font-size:12px;font-weight:700;color:var(--accent);
    text-decoration:none;display:inline-flex;align-items:center;gap:5px;
  }
  .video-link:hover{text-decoration:underline}
  .group-tag{
    font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.4px;font-weight:700;
  }

  .empty{color:var(--text-faint);font-size:14px;padding:40px 0;text-align:center}

  footer{
    margin-top:50px;padding:20px 0;border-top:1px solid var(--border);
    color:var(--text-faint);font-size:12px;text-align:center;
  }

  .part{fill:#3a3f47;stroke:#1c1e22;stroke-width:1.5}
</style>
</head>

</header>

/* ---------------------------------------------------------
   BODY DIAGRAM (simple silhouette, highlighted region)
--------------------------------------------------------- */
function bodySvg(view, parts, color){
  const on = p => parts.includes(p);
  const fill = p => on(p) ? color : null;
  const style = p => `class="part"${on(p) ? ` style="fill:${color}"` : ''}`;

  if(view === 'front'){
    return `<svg viewBox="0 0 120 220" xmlns="http://www.w3.org/2000/svg">
      <circle cx="60" cy="18" r="14" class="part"/>
      <rect x="52" y="30" width="16" height="10" rx="3" class="part"/>
      <ellipse cx="30" cy="46" rx="13" ry="10" ${style('shoulders')}/>
      <ellipse cx="90" cy="46" rx="13" ry="10" ${style('shoulders')}/>
      <rect x="12" y="44" width="17" height="36" rx="8" ${style('biceps')}/>
      <rect x="91" y="44" width="17" height="36" rx="8" ${style('biceps')}/>
      <rect x="10" y="82" width="16" height="36" rx="7" ${style('forearms')}/>
      <rect x="94" y="82" width="16" height="36" rx="7" ${style('forearms')}/>
      <rect x="36" y="40" width="48" height="32" rx="10" ${style('chest')}/>
      <rect x="42" y="74" width="36" height="36" rx="8" ${style('abs')}/>
      <rect x="40" y="110" width="40" height="18" rx="8" class="part"/>
      <rect x="40" y="130" width="18" height="48" rx="8" ${style('quads')}/>
      <rect x="62" y="130" width="18" height="48" rx="8" ${style('quads')}/>
      <rect x="41" y="180" width="16" height="36" rx="7" ${style('calves')}/>
      <rect x="63" y="180" width="16" height="36" rx="7" ${style('calves')}/>
    </svg>`;
  }
  // back view
  return `<svg viewBox="0 0 120 220" xmlns="http://www.w3.org/2000/svg">
    <circle cx="60" cy="18" r="14" class="part"/>
    <rect x="52" y="30" width="16" height="10" rx="3" class="part"/>
    <ellipse cx="30" cy="46" rx="13" ry="10" ${style('shoulders')}/>
    <ellipse cx="90" cy="46" rx="13" ry="10" ${style('shoulders')}/>
    <rect x="12" y="44" width="17" height="36" rx="8" ${style('triceps')}/>
    <rect x="91" y="44" width="17" height="36" rx="8" ${style('triceps')}/>
    <rect x="10" y="82" width="16" height="36" rx="7" ${style('forearms')}/>
    <rect x="94" y="82" width="16" height="36" rx="7" ${style('forearms')}/>
    <rect x="36" y="40" width="48" height="66" rx="10" ${style('back')}/>
    <rect x="40" y="110" width="40" height="22" rx="8" ${style('glutes')}/>
    <rect x="40" y="134" width="18" height="44" rx="8" ${style('hamstrings')}/>
    <rect x="62" y="134" width="18" height="44" rx="8" ${style('hamstrings')}/>
    <rect x="41" y="180" width="16" height="36" rx="7" ${style('calves')}/>
    <rect x="63" y="180" width="16" height="36" rx="7" ${style('calves')}/>
  </svg>`;
}

/* ---------------------------------------------------------
   EXERCISE PICTOGRAMS
   Original line-art stick figures (not photos) showing stance,
   posture and equipment placement. Built from a small library of
   reusable "stances" (body position) + "arm presets" (limb angle),
   composed per exercise.
--------------------------------------------------------- */
const RAD = d => d * Math.PI / 180;

// Arm presets, defined as if for the RIGHT arm (theta measured in
// standard math degrees: 0=right,90=up,180=left,270=down). Mirrored
// automatically for the left arm.
const ARM_PRESETS = {
  down:         {theta1:270, bend:0},
  curl:         {theta1:250, bend:130},
  overhead:     {theta1:95,  bend:10},
  lateral:      {theta1:5,   bend:5},
  front:        {theta1:55,  bend:5},
  row:          {theta1:255, bend:110},
  reachUp:      {theta1:95,  bend:0},
  across:       {theta1:330, bend:70},
  gripHigh:     {theta1:100, bend:-60},
  extendedBack: {theta1:200, bend:10},
  overheadExt:  {theta1:95,  bend:-140},
  pushdown:     {theta1:260, bend:-20},
  behindHead:   {theta1:110, bend:-150},
  plankSupport: {theta1:280, bend:95},
  reachForward: {theta1:12,  bend:0},
  holdChest:    {theta1:210, bend:110},
  pulldown:     {theta1:95,  bend:-100},
  pushup:       {theta1:250, bend:100},
};

function armPoint(shoulder, sideSign, presetName, len1, len2){
  len1 = len1 || 17; len2 = len2 || 15;
  const p = ARM_PRESETS[presetName] || ARM_PRESETS.down;
  let theta1 = p.theta1, bend = p.bend;
  if(sideSign < 0){ theta1 = 180 - theta1; bend = -bend; }
  const elbow = [shoulder[0] + len1*Math.cos(RAD(theta1)), shoulder[1] - len1*Math.sin(RAD(theta1))];
  const theta2 = theta1 + bend;
  const hand = [elbow[0] + len2*Math.cos(RAD(theta2)), elbow[1] - len2*Math.sin(RAD(theta2))];
  return {elbow, hand};
}

// Stances: hand-authored joint layouts on a 100x130 canvas.
// A few stances fix their own arm joints directly (armOverrideL/R)
// instead of using an arm preset (e.g. dip support, preacher pad).
const STANCES = {

  hinge30: {head:[44,22], neck:[46,31], pelvis:[54,64], shL:[35,35], shR:[57,35],
    hpL:[50,64], hpR:[60,64], kneeL:[48,96], kneeR:[60,96], ftL:[45,120], ftR:[60,120]},
  hinge60: {head:[32,36], neck:[38,43], pelvis:[60,62], shL:[28,46], shR:[50,46],

  hinge80: {head:[22,48], neck:[30,53], pelvis:[64,60], shL:[24,58], shR:[44,58],
    hpL:[60,60], hpR:[70,60], kneeL:[57,92], kneeR:[68,92], ftL:[52,120], ftR:[64,120]},
  seated: {head:[50,20], neck:[50,31], pelvis:[50,64], shL:[39,34], shR:[61,34],
    hpL:[43,64], hpR:[57,64], kneeL:[40,66], kneeR:[60,66], ftL:[38,98], ftR:[62,98]},
  seatedRecline: {head:[20,52], neck:[28,55], pelvis:[52,62], shL:[22,46], shR:[30,60],
    hpL:[48,60], hpR:[56,64], kneeL:[66,44], kneeR:[70,50], ftL:[86,30], ftR:[90,36]},
  lyingBack: {head:[14,58], neck:[24,58], pelvis:[62,58], shL:[24,48], shR:[24,68],
    hpL:[58,50], hpR:[58,66], kneeL:[78,42], kneeR:[78,66], ftL:[92,52], ftR:[92,74]},
  lyingProne: {head:[14,48], neck:[24,50], pelvis:[62,52], shL:[24,40], shR:[24,60],
    hpL:[58,44], hpR:[58,60], kneeL:[80,40], kneeR:[80,62], ftL:[86,20], ftR:[86,66]},
  plank: {head:[12,40], neck:[22,42], pelvis:[62,48], shL:[22,34], shR:[22,52],
    hpL:[58,42], hpR:[58,54], kneeL:[80,48], kneeR:[80,56], ftL:[96,50], ftR:[96,58]},
  hanging: {head:[50,24], neck:[50,34], pelvis:[50,76], shL:[40,38], shR:[60,38],
    hpL:[46,76], hpR:[54,76], kneeL:[45,102], kneeR:[55,102], ftL:[44,122], ftR:[56,122]},
  hangingRaised: {head:[50,24], neck:[50,34], pelvis:[50,76], shL:[40,38], shR:[60,38],
    hpL:[46,76], hpR:[54,76], kneeL:[62,66], kneeR:[68,70], ftL:[76,58], ftR:[80,64]},
  kneeling: {head:[50,20], neck:[50,31], pelvis:[50,62], shL:[39,34], shR:[61,34],
    hpL:[44,62], hpR:[56,62], kneeL:[44,98], kneeR:[56,98], ftL:[44,112], ftR:[56,112]},
  split: {head:[40,16], neck:[41,27], pelvis:[42,62], shL:[30,30], shR:[52,30],
    hpL:[36,62], hpR:[48,62], kneeL:[30,92], kneeR:[62,84], ftL:[26,120], ftR:[78,100]},
  step: {head:[44,14], neck:[45,25], pelvis:[48,60], shL:[34,28], shR:[56,28],
    hpL:[42,60], hpR:[54,60], kneeL:[38,84], kneeR:[58,90], ftL:[34,100], ftR:[66,118]},
  dipSupport: {head:[50,20], neck:[50,31], pelvis:[50,58], shL:[39,34], shR:[61,34],
    hpL:[45,58], hpR:[55,58], kneeL:[48,86], kneeR:[54,90], ftL:[54,100], ftR:[62,100],
    armOverrideL:{elbow:[34,46], hand:[30,58]}, armOverrideR:{elbow:[66,46], hand:[70,58]}},
  preacher: {head:[46,18], neck:[47,28], pelvis:[54,60], shL:[36,32], shR:[58,32],
    hpL:[50,60], hpR:[60,60], kneeL:[48,92], kneeR:[58,92], ftL:[45,118], ftR:[60,118],
    armOverrideL:{elbow:[28,42], hand:[24,58]}, armOverrideR:{elbow:[58,32], hand:[63,20]}},
  hipThrust: {head:[16,66], neck:[24,64], pelvis:[52,50], shL:[26,60], shR:[26,70],
    hpL:[50,50], hpR:[58,52], kneeL:[70,62], kneeR:[72,70], ftL:[86,64], ftR:[88,74],
    armOverrideL:{elbow:[26,44], hand:[26,32]}, armOverrideR:{elbow:[26,74], hand:[26,86]}},
  situp: {head:[34,38], neck:[38,46], pelvis:[58,66], shL:[28,48], shR:[40,52],
    hpL:[54,66], hpR:[64,66], kneeL:[52,66], kneeR:[64,66], ftL:[50,98], ftR:[66,98],
    armOverrideL:{elbow:[32,44], hand:[36,46]}, armOverrideR:{elbow:[34,48], hand:[38,50]}},
  seatedTwist: {head:[44,30], neck:[46,38], pelvis:[58,66], shL:[34,42], shR:[52,44],
    hpL:[54,66], hpR:[64,66], kneeL:[50,64], kneeR:[64,64], ftL:[46,84], ftR:[64,84]},
};

// Fixed extras per stance (drawn from absolute coordinates matching
// that stance's own geometry): pull-up bar, dip bars, step box, bench.
const STANCE_EXTRAS = {
  hanging:       [{type:'bar', x1:30, y1:20, x2:70, y2:20}],
  hangingRaised: [{type:'bar', x1:30, y1:20, x2:70, y2:20}],
  step:          [{type:'box', x:16, y:98, w:36, h:22}],
  dipSupport:    [{type:'dipBar', x:30, y1:44, y2:70}, {type:'dipBar', x:70, y1:44, y2:70}],
  hipThrust:     [{type:'bench', x:2, y:56, w:26, h:16}],
};

const BONES = [
  ['neck','pelvis'], ['neck','shL'], ['shL','elbowL'], ['elbowL','handL'],
  ['neck','shR'], ['shR','elbowR'], ['elbowR','handR'],
  ['pelvis','hpL'], ['hpL','kneeL'], ['kneeL','ftL'],
  ['pelvis','hpR'], ['hpR','kneeR'], ['kneeR','ftR'],
];

function buildJoints(spec){
  const st = STANCES[spec.stance];
  const joints = Object.assign({}, st);
  if(st.armOverrideL){ joints.elbowL = st.armOverrideL.elbow; joints.handL = st.armOverrideL.hand; }
  else { const r = armPoint(st.shL, -1, spec.armL || 'down'); joints.elbowL = r.elbow; joints.handL = r.hand; }
  if(st.armOverrideR){ joints.elbowR = st.armOverrideR.elbow; joints.handR = st.armOverrideR.hand; }
  else { const r = armPoint(st.shR, 1, spec.armR || 'down'); joints.elbowR = r.elbow; joints.handR = r.hand; }
  return joints;
}

function renderStick(joints){
  const color = '#8b93a1';
  let s = `<circle cx="${joints.head[0]}" cy="${joints.head[1]}" r="7" fill="${color}"/>`;
  BONES.forEach(([a,b]) => {
    const p1 = joints[a], p2 = joints[b];
    if(!p1 || !p2) return;
    s += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="${color}" stroke-width="7" stroke-linecap="round"/>`;
  });
  return s;
}

function barAccessory(p1, p2, color){
  return `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="${color}" stroke-width="4" stroke-linecap="round"/>`
    + `<circle cx="${p1[0]}" cy="${p1[1]}" r="5" fill="${color}"/><circle cx="${p2[0]}" cy="${p2[1]}" r="5" fill="${color}"/>`;
}
function dumbbellAccessory(p, color){
  return `<g transform="translate(${p[0]},${p[1]})">`
    + `<rect x="-7" y="-2" width="14" height="4" rx="1" fill="${color}"/>`
    + `<rect x="-9" y="-5" width="5" height="10" rx="1.5" fill="${color}"/>`
    + `<rect x="4" y="-5" width="5" height="10" rx="1.5" fill="${color}"/></g>`;
}
function cableAccessory(from, to, color){
  return `<line x1="${from[0]}" y1="${from[1]}" x2="${to[0]}" y2="${to[1]}" stroke="${color}" stroke-width="2" stroke-dasharray="3,2"/>`
    + `<circle cx="${to[0]}" cy="${to[1]}" r="4" fill="${color}"/>`;
}
function rectAccessory(x, y, w, h, color, opacity){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2.5" fill="${color}"${opacity ? ` opacity="${opacity}"` : ''}/>`;
}

const PULLEY = { high:[96,10], mid:[96,40], low:[96,124] };

function renderGear(spec, joints){
  const eq = spec.equipment;
  if(!eq || eq === 'bodyweight') return '';
  const color = `var(--eq-${eq})`;

  if(eq === 'barbell'){
    if(spec.gearAt === 'shoulders') return barAccessory(joints.shL, joints.shR, color);
    if(spec.gearAt === 'hips'){ const c = joints.pelvis; return barAccessory([c[0]-14,c[1]], [c[0]+14,c[1]], color); }
    return barAccessory(joints.handL, joints.handR, color);
  }
  if(eq === 'dumbbell'){
    const hands = spec.gearHands || ['L','R'];
    if(hands.includes('center')){
      const mid = [(joints.handL[0]+joints.handR[0])/2, (joints.handL[1]+joints.handR[1])/2];
      return dumbbellAccessory(mid, color);
    }
    let s = '';
    if(hands.includes('L')) s += dumbbellAccessory(joints.handL, color);
    if(hands.includes('R')) s += dumbbellAccessory(joints.handR, color);
    return s;
  }
  if(eq === 'cable'){
    const to = PULLEY[spec.cableTo || 'high'];
    let from;
    if(spec.cableJoint === 'mid') from = [(joints.handL[0]+joints.handR[0])/2, (joints.handL[1]+joints.handR[1])/2];
    else if(spec.cableJoint === 'ftR') from = joints.ftR;
    else if(spec.cableJoint === 'L') from = joints.handL;
    else from = joints.handR;
    let s = cableAccessory(from, to, color);
    if(spec.cableBoth) s += cableAccessory(joints.handL, PULLEY[spec.cableToL || 'high'].map((v,i)=> i===0?4:v), color);
    return s;
  }
  if(eq === 'machine'){
    if(spec.gearAt === 'none') return '';
    if(spec.gearAt === 'shoulder-pads') return rectAccessory(joints.shL[0]-6, joints.shL[1]-15, 12, 9, color) + rectAccessory(joints.shR[0]-6, joints.shR[1]-15, 12, 9, color);
    if(spec.gearAt === 'knee-pad') return rectAccessory(joints.kneeL[0]-5, joints.kneeL[1]-3, 30, 8, color);
    const seatW = 30;
    return rectAccessory(joints.pelvis[0]-seatW/2, joints.pelvis[1]-2, seatW, 9, color)
      + rectAccessory(joints.neck[0]-4, Math.min(joints.neck[1],joints.pelvis[1])-2, 8, Math.abs(joints.pelvis[1]-joints.neck[1]), color, 0.3);
  }
  return '';
}

function renderExtras(spec, joints){
  let s = '';
  (STANCE_EXTRAS[spec.stance] || []).forEach(item => {
    if(item.type === 'bar') s += `<line x1="${item.x1}" y1="${item.y1}" x2="${item.x2}" y2="${item.y2}" stroke="#5a6270" stroke-width="4" stroke-linecap="round"/>`;
    if(item.type === 'box') s += rectAccessory(item.x, item.y, item.w, item.h, '#2a2d33');
    if(item.type === 'bench') s += rectAccessory(item.x, item.y, item.w, item.h, '#2a2d33');
    if(item.type === 'dipBar') s += `<line x1="${item.x}" y1="${item.y1}" x2="${item.x}" y2="${item.y2}" stroke="#5a6270" stroke-width="4" stroke-linecap="round"/>`;
  });
  if(spec.extraBench){
    const y = joints.neck[1];
    const x1 = Math.min(joints.head[0], joints.pelvis[0]) - 6;
    const x2 = Math.max(joints.kneeL[0], joints.kneeR[0]) + 4;
    s += rectAccessory(x1, y-9, x2-x1, 18, '#2a2d33');
  }
  return s;
}

function exerciseIcon(spec){
  if(!spec || !STANCES[spec.stance]) return '';
  const joints = buildJoints(spec);
  const extras = renderExtras(spec, joints);
  const stick = renderStick(joints);
  const gear = renderGear(spec, joints);
  return `<svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">${extras}${stick}${gear}</svg>`;
}

/* ---------------------------------------------------------
   STATE + RENDER
--------------------------------------------------------- */
const savedLang = (() => { try { return localStorage.getItem('exlib-lang'); } catch(e){ return null; } })();
const state = { groupId: null, search: '', equipment: 'all', lang: (savedLang === 'nl') ? 'nl' : 'en' };

function groupById(id){ return GROUPS.find(g => g.id === id); }
function exerciseCount(id){ return EXERCISES.filter(e => e.group === id).length; }

function t(key, ...args){
  const val = UI[state.lang][key];
  return typeof val === 'function' ? val(...args) : val;
}
function groupName(g){ return state.lang === 'nl' && g.nl ? g.nl.name : g.name; }
function groupBlurb(g){ return state.lang === 'nl' && g.nl ? g.nl.blurb : g.blurb; }
function eqLabel(eq){ const meta = EQUIPMENT[eq]; return state.lang === 'nl' ? meta.label_nl : meta.label; }
function exTr(ex){ return state.lang === 'nl' ? TRANSLATIONS_NL[ex.name] : null; }
function exPrimary(ex){ const tr = exTr(ex); return tr ? tr.primary : ex.primary; }
function exSecondary(ex){ const tr = exTr(ex); return tr ? tr.secondary : ex.secondary; }
function exCue(ex){ const tr = exTr(ex); return tr ? tr.cue : ex.cue; }

function eqBadge(eq){
  const meta = EQUIPMENT[eq];
  return `<span class="eq-badge" style="background:${meta.color}">${eqLabel(eq)}</span>`;
}

function exerciseCard(ex, showGroupTag){
  const g = groupById(ex.group);
  const secondary = exSecondary(ex).map(s => `<span class="pill secondary">${s}</span>`).join('');
  const iconSpec = Object.assign({equipment: ex.equipment}, ex.icon || {});
  const photo = PHOTOS[ex.name];
  const media = photo
    ? `<img src="images/${photo}" alt="${ex.name} demonstration" loading="lazy">`
    : exerciseIcon(iconSpec);
  return `<div class="ex-card">
    <div class="pictogram${photo ? ' has-photo' : ''}">${media}</div>
    <div class="ex-body">
      <div class="ex-top">
        <div>
          ${showGroupTag ? `<div class="group-tag" style="color:${g.color}">${groupName(g)}</div>` : ''}
          <div class="ex-name">${ex.name}</div>
        </div>
        ${eqBadge(ex.equipment)}
      </div>
      <div class="muscle-row">
        <span class="pill primary">${exPrimary(ex)}</span>
        ${secondary}
      </div>
      <div class="cue">${exCue(ex)}</div>
      ${VIDEOS[ex.name] ? `<a class="video-link" href="https://www.youtube.com/watch?v=${VIDEOS[ex.name]}" target="_blank" rel="noopener">▶ ${t('watchVideo')}</a>` : ''}
    </div>
  </div>`;
}

function matchesFilters(ex){
  if(state.equipment !== 'all' && ex.equipment !== state.equipment) return false;
  if(state.search){
    const q = state.search.toLowerCase();
    const hay = (ex.name + ' ' + exPrimary(ex) + ' ' + exSecondary(ex).join(' ')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function renderChips(){
  const chipRow = document.getElementById('chipRow');
  let html = `<div class="chip ${state.equipment==='all'?'active':''}" data-eq="all">${t('allEquipment')}</div>`;
  Object.keys(EQUIPMENT).forEach(key => {
    const meta = EQUIPMENT[key];
    html += `<div class="chip ${state.equipment===key?'active':''}" data-eq="${key}">
      <span class="dot" style="background:${meta.color}"></span>${eqLabel(key)}
    </div>`;
  });
  chipRow.innerHTML = html;
  chipRow.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      state.equipment = chip.dataset.eq;
      renderChips();
      renderApp();
    });
  });
}

function setLang(lang){
  state.lang = lang;
  try { localStorage.setItem('exlib-lang', lang); } catch(e){}
  document.getElementById('brandLabel').textContent = t('brand');
  document.getElementById('searchInput').placeholder = t('searchPlaceholder');
  document.getElementById('backBtn').textContent = t('back');
  document.getElementById('footerText').textContent = t('footer');
  document.querySelectorAll('#langToggle .lang-opt').forEach(el => {
    el.classList.toggle('active', el.dataset.lang === lang);
  });
  renderChips();
  renderApp();
}

function renderApp(){
  const app = document.getElementById('app');
  const backBtn = document.getElementById('backBtn');
  backBtn.style.display = state.groupId ? 'inline-block' : 'none';

  // Global search (no group selected): flat filtered list across all groups
  if(!state.groupId && state.search){
    const results = EXERCISES.filter(matchesFilters);
    app.innerHTML = `
      <div class="section-label">${t('resultsFor', results.length, state.search)}</div>
      <div class="ex-grid">${results.map(e => exerciseCard(e, true)).join('') || ''}</div>
      ${results.length===0 ? `<div class="empty">${t('noResults')}</div>` : ''}
    `;
    return;
  }

  // Home: group grid
  if(!state.groupId){
    app.innerHTML = `
      <div class="hero">
        <h1>${t('heroTitle')}</h1>
        <p>${t('heroSub')}</p>
      </div>
      <div class="group-grid">
        ${GROUPS.map(g => `
          <div class="group-card" style="--group-color:${g.color}" data-group="${g.id}">
            ${bodySvg(g.view, g.parts, g.color)}
            <div class="gname">${groupName(g)}</div>
            <div class="gcount">${t('exercisesLabel', exerciseCount(g.id))}</div>
          </div>
        `).join('')}
      </div>
    `;
    app.querySelectorAll('.group-card').forEach(card => {
      card.addEventListener('click', () => {
        state.groupId = card.dataset.group;
        state.search = '';
        document.getElementById('searchInput').value = '';
        location.hash = state.groupId;
        renderApp();
        window.scrollTo({top:0, behavior:'smooth'});
      });
    });
    return;
  }

  // Group detail view
  const g = groupById(state.groupId);
  const list = EXERCISES.filter(e => e.group === g.id).filter(matchesFilters);
  app.innerHTML = `
    <div class="group-header">
      ${bodySvg(g.view, g.parts, g.color)}
      <div>
        <h2 style="color:${g.color}">${groupName(g)}</h2>
        <p class="sub">${groupBlurb(g)}</p>
      </div>
    </div>
    <div class="ex-grid">${list.map(e => exerciseCard(e, false)).join('')}</div>
    ${list.length===0 ? `<div class="empty">${t('noResultsGroup')}</div>` : ''}
  `;
}

/* ---------------------------------------------------------
   EVENTS
--------------------------------------------------------- */
document.getElementById('searchInput').addEventListener('input', e => {
  state.search = e.target.value.trim();
  renderApp();
});

document.getElementById('backBtn').addEventListener('click', () => {
  state.groupId = null;
  state.search = '';
  document.getElementById('searchInput').value = '';
  location.hash = '';
  renderApp();
  window.scrollTo({top:0, behavior:'smooth'});
});

document.getElementById('brandHome').addEventListener('click', () => {
  state.groupId = null;
  state.search = '';
  document.getElementById('searchInput').value = '';
  location.hash = '';
  renderApp();
  window.scrollTo({top:0, behavior:'smooth'});
});

window.addEventListener('hashchange', () => {
  const id = location.hash.replace('#','');
  state.groupId = groupById(id) ? id : null;
  renderApp();
});

document.getElementById('langToggle').addEventListener('click', () => {
  setLang(state.lang === 'en' ? 'nl' : 'en');
});

/* init */
(function init(){
  const id = location.hash.replace('#','');
  state.groupId = groupById(id) ? id : null;
  if(state.lang === 'nl'){
    document.getElementById('brandLabel').textContent = t('brand');
    document.getElementById('searchInput').placeholder = t('searchPlaceholder');
    document.getElementById('backBtn').textContent = t('back');
    document.getElementById('footerText').textContent = t('footer');
    document.querySelectorAll('#langToggle .lang-opt').forEach(el => {
      el.classList.toggle('active', el.dataset.lang === 'nl');
    });
  }
  renderChips();
  renderApp();
})();
</script>
